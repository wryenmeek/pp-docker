name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: 1. Biome Check (Format & Lint)
        run: bun run check

      - name: 2. TypeScript Typecheck
        run: bun run typecheck

      - name: 3. Knip (Dead Code & Dependency Hygiene)
        run: bun run knip

      - name: 4. Bun Test & Code Coverage
        run: |
          echo "### 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          bun run test:coverage | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 5. Build Distribution
        run: bun run build
